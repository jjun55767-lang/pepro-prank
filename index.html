<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빼빼로 선물</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{background:#f4f3f7;color:#222;display:grid;place-items:center;cursor:pointer}
#gift{width:min(100%,430px);height:100%;min-height:560px;background:#fff;padding:30px 22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.small{font-size:14px;color:#9270c8;font-weight:700}
h1{font-size:29px;margin:16px 0}
.box{border:1px solid #eee;border-radius:22px;padding:34px 18px;margin:18px 0;box-shadow:0 8px 28px #0000000b}
.choco{font-size:78px}
.name{font-size:22px;font-weight:800;margin-top:14px}
.tap{margin-top:22px;font-size:15px;color:#8a62d1;font-weight:700}
#ghost{display:none;position:fixed;inset:0;background:#030307;color:white;z-index:5;align-items:center;justify-content:center;flex-direction:column;text-align:center}
#ghost.show{display:flex;animation:flash .13s steps(2,end) 4}
.face{font-size:min(75vw,390px);line-height:1;filter:drop-shadow(0 0 28px #fff)}
.scream{font-size:clamp(34px,10vw,64px);font-weight:900;margin-top:24px;text-shadow:0 0 18px #fff}
@keyframes flash{50%{background:#29202f}}
</style>
</head>
<body>
<main id="gift" aria-label="빼빼로 선물">
<div class="small">깜짝 선물 도착!</div>
<h1>빼빼로 선물 🎁</h1>
<section class="box">
<div class="choco">🍫</div>
<div class="name">빼빼로 선물 세트</div>
<div class="tap">화면을 누르면 선물이 열려요</div>
</section>
</main>
<div id="ghost" aria-hidden="true">
<div class="face">👻</div>
<div class="scream">으아아아악!!!</div>
</div>
<script>
const ghost=document.getElementById("ghost");
function reveal(){ghost.classList.add("show");ghost.setAttribute("aria-hidden","false");}
document.body.addEventListener("click",reveal);
document.body.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal();}});
</script>
</body>
</html>
