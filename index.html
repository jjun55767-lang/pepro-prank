<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>빼빼로 선물</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#fff;font:16px sans-serif}
</style>
</head>
<body>
<div id="loading">빼빼로 선물을 여는 중...</div>
<script>
(async function(){
  const RAW="https://raw.githubusercontent.com/jonathanbassedas/halloween/main/index.html";
  const ORIGINAL="https://jonathanbassedas.github.io/halloween/";
  try{
    const response=await fetch(RAW,{cache:"no-store"});
    if(!response.ok) throw new Error("원본 페이지를 불러오지 못했습니다.");
    let source=await response.text();
    source=source.replace(/<title>[\\s\\S]*?<\\/title>/i,"<title>빼빼로 선물</title>");
    source=source.replace("<head>",'<head><base href="'+ORIGINAL+'"><style>#overlay{display:none!important}#scare{display:block!important;z-index:10!important}</style>');
    const injected='<script>window.addEventListener("DOMContentLoaded",function(){var o=document.getElementById("overlay");if(o)o.remove();var s=document.getElementById("scare");if(s)s.style.display="block";var v=document.getElementById("video");if(v){v.autoplay=true;v.playsInline=true;var p=v.play();if(p&&p.catch)p.catch(function(){v.muted=true;v.play().catch(function(){});});}});<\\/script>';
    source=source.replace("</body>",injected+"</body>");
    document.open();document.write(source);document.close();
  }catch(e){
    document.getElementById("loading").textContent="선물을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.";
  }
})();
</script>
</body>
</html>
