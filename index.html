<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선물이 도착했어요 🎁</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#252525}
.phone{width:min(100%,420px);min-height:100vh;background:#fff;display:flex;flex-direction:column;padding:28px 22px 34px}
.top{font-size:14px;color:#777;text-align:center;margin:4px 0 42px}
.eyebrow{text-align:center;color:#9a75d6;font-weight:700;font-size:14px}
h1{text-align:center;font-size:25px;line-height:1.4;margin:12px 0 8px}
.sub{text-align:center;color:#777;font-size:14px;line-height:1.6;margin:0 0 30px}
.gift{border:1px solid #eee;border-radius:18px;padding:22px;text-align:center;background:#fff;box-shadow:0 8px 30px #22208}
.gift-emoji{font-size:64px;line-height:1.3;margin-bottom:12px}
.brand{font-size:13px;color:#999;margin-bottom:7px}
.product{font-size:20px;font-weight:800;margin-bottom:8px}
.desc{font-size:13px;color:#777}
.sender{margin:24px 0 0;padding:18px;border-radius:14px;background:#f8f6fc;text-align:center;font-size:14px;color:#555}
button{margin-top:auto;border:0;border-radius:13px;background:#8d63d8;color:white;font-size:17px;font-weight:700;padding:17px 12px;cursor:pointer;box-shadow:0 5px 14px #8d63d833}
button:disabled{opacity:.65}
.note{text-align:center;color:#aaa;font-size:11px;margin:13px 0 0}
</style>
</head>
<body>
<main class="phone">
<div class="top">선물함</div>
<div class="eyebrow">YOU GOT A GIFT</div>
<h1>깜짝 선물이 도착했어요! 🎁</h1>
<p class="sub">소중한 사람이 마음을 담아 선물을 보냈어요.</p>
<section class="gift">
<div class="gift-emoji">🍫</div>
<div class="brand">PEPERO</div>
<div class="product">빼빼로 선물 세트</div>
<div class="desc">달콤한 마음을 담은 선물</div>
</section>
<div class="sender">보낸 사람 <strong>친구</strong></div>
<button id="open">빼빼로 선물받기</button>
<div class="note">선물은 버튼을 누르면 열려요.</div>
</main>
<script>
const RAW = "https://raw.githubusercontent.com/jonathanbassedas/halloween/main/index.html";
const ORIGINAL = "https://jonathanbassedas.github.io/halloween/";
document.getElementById("open").addEventListener("click", async function () {
  this.disabled = true;
  this.textContent = "선물을 여는 중...";
  try {
    const response = await fetch(RAW, {cache:"no-store"});
    if (!response.ok) throw new Error("원본 페이지를 불러오지 못했어요.");
    let source = await response.text();
    source = source.replace("<head>", '<head><base href="' + ORIGINAL + '"><style>#overlay{display:none!important}#scare{display:block!important}</style>');
    const injected = '<script>window.addEventListener("DOMContentLoaded",function(){var overlay=document.getElementById("overlay");if(overlay)overlay.remove();var scare=document.getElementById("scare");if(scare)scare.style.display="block";var video=document.getElementById("video");if(video){video.autoplay=true;video.playsInline=true;var p=video.play();if(p&&p.catch)p.catch(function(){video.muted=true;video.play().catch(function(){});});}});<\/script>';
    source = source.replace("</body>", injected + "</body>");
    document.open();
    document.write(source);
    document.close();
  } catch (error) {
    this.disabled = false;
    this.textContent = "다시 시도하기";
    alert("원본 귀신 영상을 불러오지 못했어. 잠시 후 다시 눌러줘.");
  }
});
</script>
</body>
</html>
